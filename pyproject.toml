[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-replay-debugger"
version = "0.1.0"
description = "Framework-agnostic CLI tool for replaying and visualizing agent execution traces."
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.scripts]
ard = "ard.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/ard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.",
    "\\.\\.\\.",
]
